<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>PayLoop</title>
<style>html,body{margin:0;padding:0;background:#0b1220;color:#e5ecff;font-family:system-ui,Tahoma,sans-serif}
.w{max-width:520px;margin:0 auto;padding:28px 18px;text-align:center;line-height:2}
h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;color:#9fb3d9;font-size:14px}</style></head>
<body><div class="w"><h1 id="t">PayLoop</h1><p id="m">جارٍ تحميل العروض…</p></div>
<script>
/* يقبل فقط معرّف مستخدم بصيغة UUID، ثم يحمّل سكربت CPAGrip مع tracking_id. هذه الصفحة على نطاق منفصل عن التطبيق عمدًا. */
(function(){
  var u=(new URLSearchParams(location.search).get('u')||'').toLowerCase();
  var ok=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(u);
  var m=document.getElementById('m');
  if(!ok){ m.textContent='رابط غير صالح. ارجع إلى التطبيق وافتح العروض من جديد.'; return; }
  var s=document.createElement('script'); s.type='text/javascript';
  s.src='https://playabledownloads.com/script_include.php?id=1920245&tracking_id='+encodeURIComponent(u);
  s.onerror=function(){ m.textContent='تعذّر تحميل العروض الآن. حاول لاحقًا.'; };
  document.head.appendChild(s);
  m.textContent='جارٍ البحث عن عروض لبلدك…';
  /* بعد 10 ثوانٍ: إن لم يظهر أي عنصر مرئي من CPAGrip (حتى لو أضافت عناصر مخفية) نعرض رسالة واضحة */
  function seen(){
    var els=document.querySelectorAll('body > *:not(.w):not(script):not(style), iframe');
    for(var i=0;i<els.length;i++){
      var e=els[i], cs=getComputedStyle(e), r=e.getBoundingClientRect();
      if(cs.display!=='none'&&cs.visibility!=='hidden'&&cs.opacity!=='0'&&r.width>60&&r.height>60) return true;
    }
    return false;
  }
  setTimeout(function(){
    if(seen()) m.textContent='أكمل عرضًا واحدًا ثم ارجع إلى التطبيق لترى رصيدك.';
    else m.textContent='لا توجد عروض متاحة لبلدك أو جهازك الآن. حاول لاحقًا.';
  },10000);
})();
</script></body></html>
